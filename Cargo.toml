[workspace]
resolver = "3"
members = [
    "apps/cogniform-cli",
    "crates/cogniform-assets",
    "crates/cogniform-compiler",
    "crates/cogniform-engine",
    "crates/cogniform-local-transport",
    "crates/cogniform-observation",
    "crates/cogniform-procedural",
    "crates/cogniform-protocol",
    "crates/cogniform-renderer",
    "crates/cogniform-replay",
    "crates/cogniform-storage",
    "crates/cogniform-world",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/xsparc/cogniform"

[workspace.dependencies]
cogniform-assets = { version = "=0.0.0", path = "crates/cogniform-assets" }
cogniform-compiler = { version = "=0.0.0", path = "crates/cogniform-compiler" }
cogniform-engine = { version = "=0.0.0", path = "crates/cogniform-engine" }
cogniform-local-transport = { version = "=0.0.0", path = "crates/cogniform-local-transport" }
cogniform-observation = { version = "=0.0.0", path = "crates/cogniform-observation" }
cogniform-procedural = { version = "=0.0.0", path = "crates/cogniform-procedural" }
cogniform-protocol = { version = "=0.0.0", path = "crates/cogniform-protocol" }
cogniform-renderer = { version = "=0.0.0", path = "crates/cogniform-renderer" }
cogniform-replay = { version = "=0.0.0", path = "crates/cogniform-replay" }
cogniform-storage = { version = "=0.0.0", path = "crates/cogniform-storage" }
cogniform-world = { version = "=0.0.0", path = "crates/cogniform-world" }
hecs = { version = "=0.11.1", default-features = false, features = ["std"] }
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
wgpu = { version = "=30.0.0", default-features = false, features = [
    "dx12",
    "std",
    "vulkan",
    "wgsl",
] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
